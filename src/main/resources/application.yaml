spring:
  application:
    name: cen-edu
  profiles:
    default: local
  config:
    # 프로젝트 루트의 .env 를 프로퍼티 파일로 읽는다. 파일이 없어도 기동된다(optional).
    # 실제 OS 환경 변수가 이 파일보다 우선순위가 높다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cen_edu}
    username: ${DB_USERNAME:cen}
    password: ${DB_PASSWORD:cen_local_password}
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마 변경은 Flyway 로만 한다. update / create 금지
    open-in-view: false
  flyway:
    enabled: true               # analysis baseline(V20260807_1000) 부터 활성
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      region: ${AWS_REGION:ap-northeast-2}
      problem-bucket: ${AWS_S3_PROBLEM_BUCKET:}
      answer-bucket: ${AWS_S3_ANSWER_BUCKET:}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  ai:
    guard:
      input:
        max-length: ${AI_INPUT_MAX_LENGTH:500}
    client:
      # 키가 없어도 기동되도록 빈 문자열을 기본값으로 둔다. 챗봇을 쓰지 않는 팀원이
      # 키 없이 개발할 수 있어야 한다. 키가 비면 호출 시점에 실패한다.
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5-mini}
      # GPT-5 계열은 추론 토큰이 max-completion-tokens 에서 차감된다. 한도가 낮으면
      # content 가 빈 문자열로 잘려 돌아온다. minimal + 3000 은 실측으로 정한 값이다.
      reasoning-effort: ${OPENAI_REASONING_EFFORT:minimal}
      max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:3000}
      timeout: ${OPENAI_TIMEOUT:60s}
      max-retries: ${OPENAI_MAX_RETRIES:2}
      # 목적별 모델. 지정하지 않은 값은 위 기본값을 따른다.
      use-cases:
        # 검증은 저작과 다른 모델을 쓴다. 같은 모델이면 같은 방식으로 틀리고,
        # 둘 다 틀려도 대조가 통과해 검증기가 통과 도장 기계가 된다.
        # minimal 을 쓰지 않는 이유: 검증기는 문항을 실제로 풀어야 한다.
        verification:
          model: ${OPENAI_VERIFICATION_MODEL:gpt-5}
          reasoning-effort: ${OPENAI_VERIFICATION_REASONING_EFFORT:medium}
          max-completion-tokens: ${OPENAI_VERIFICATION_MAX_COMPLETION_TOKENS:6000}
    verification:
      content-check:
        # 정답이 든 원본으로 해설 정합·개념 안내 누출을 본다. 끄면 문항당 LLM 호출이 절반이 된다.
        # 골든셋 측정과 개발 반복에서만 끈다. 꺼도 서술형 루브릭 심사는 계속 돈다.
        enabled: ${AI_VERIFICATION_CONTENT_CHECK_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
logging:
  pattern:
    # AgentDispatcher 가 채우는 traceId 를 로그 레벨 옆에 찍는다. 한 번의 에이전트 호출에
    # 걸린 로그를 이 값으로 묶어서 본다. 디스패치 밖의 로그는 빈 대괄호로 나온다.
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
