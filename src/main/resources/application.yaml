spring:
  application:
    name: cen-edu
  profiles:
    default: local
  config:
    # 프로젝트 루트의 .env 를 프로퍼티 파일로 읽는다. 파일이 없어도 기동된다(optional).
    # 실제 OS 환경 변수가 이 파일보다 우선순위가 높다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cen_edu}
    username: ${DB_USERNAME:cen}
    password: ${DB_PASSWORD:cen_local_password}
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마 변경은 Flyway 로만 한다. update / create 금지
    open-in-view: false
  flyway:
    enabled: true               # analysis baseline(V20260807_1000) 부터 활성
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

app:
  problem-authoring:
    semantic:
      enabled: ${PROBLEM_SEMANTIC_AUTHORING_ENABLED:false}
  problem:
    rag:
      enabled: ${PROBLEM_RAG_ENABLED:false}
      policy-version: A_DENSE_MMR_V1
      candidate-limit: 40
      standard-selection-limit: 3
      personalized-selection-limit: 4
      default-lambda: 0.70
      application-lambda: 0.55
      search-timeout: 2s
      indexing:
        enabled: ${PROBLEM_RAG_INDEXING_ENABLED:false}
        batch-size: 20
        max-attempts: 3
        retry-delay: 30s
        worker-delay: 5s
        backfill-delay: 60s
  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      region: ${AWS_REGION:ap-northeast-2}
      problem-bucket: ${AWS_S3_PROBLEM_BUCKET:}
      answer-bucket: ${AWS_S3_ANSWER_BUCKET:}
      # 화면을 열어둔 채 이미지를 다시 그릴 때까지 서명이 살아 있어야 한다. 짧으면 S3가 403을 준다.
      answer-url-expiration: ${AWS_S3_ANSWER_URL_EXPIRATION:2h}
      problem-url-expiration: ${AWS_S3_PROBLEM_URL_EXPIRATION:6h}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      # 서술형 채점이 모델에 넘기는 답안 이미지 URL 의 만료. 칸마다 채점 직전에 발급하므로
      # 한 칸이 채점되는 동안만 살면 된다. 유효한 동안에는 URL 을 가진 누구나 학생 필기를
      # 볼 수 있어 기본값을 짧게 둔다 — 측정용으로 길게 쓰는 local 만 따로 덮는다.
      grading-pipeline-url-expiration: ${AWS_S3_GRADING_PIPELINE_URL_EXPIRATION:15m}
  ai:
    embedding:
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: 1024
    guard:
      input:
        max-length: ${AI_INPUT_MAX_LENGTH:500}
    client:
      # 키가 없어도 기동되도록 빈 문자열을 기본값으로 둔다. 챗봇을 쓰지 않는 팀원이
      # 키 없이 개발할 수 있어야 한다. 키가 비면 호출 시점에 실패한다.
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}
      # GPT-5 계열은 추론 토큰이 max-completion-tokens 에서 차감된다. 한도가 낮으면
      # content 가 빈 문자열로 잘려 돌아온다. minimal + 3000 은 실측으로 정한 값이다.
      reasoning-effort: ${OPENAI_REASONING_EFFORT:medium}
      max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:3000}
      timeout: ${OPENAI_TIMEOUT:60s}
      max-retries: ${OPENAI_MAX_RETRIES:2}
      # 목적별 모델. 지정하지 않은 값은 위 기본값을 따른다.
      use-cases:
        # 검증은 저작과 다른 모델을 쓴다. 같은 모델이면 같은 방식으로 틀리고,
        # 둘 다 틀려도 대조가 통과해 검증기가 통과 도장 기계가 된다.
        # minimal 을 쓰지 않는 이유: 검증기는 문항을 실제로 풀어야 한다.
        verification:
          model: ${OPENAI_VERIFICATION_MODEL:gpt-5}
          reasoning-effort: ${OPENAI_VERIFICATION_REASONING_EFFORT:medium}
          max-completion-tokens: ${OPENAI_VERIFICATION_MAX_COMPLETION_TOKENS:6000}
        # 분석 문장은 문항마다 문장 세 개를 한 번에 받아 출력이 길다. 실측으로 문항당
        # 약 110 토큰이라 25문항 근처에서 기본 상한에 닿고, 넘으면 JSON 이 잘려 실패한다.
        # 모델과 추론 강도는 기본값과 같게 두고 상한만 올린다.
        analysis_report:
          model: ${OPENAI_ANALYSIS_REPORT_MODEL:gpt-5-mini}
          reasoning-effort: ${OPENAI_ANALYSIS_REPORT_REASONING_EFFORT:minimal}
          max-completion-tokens: ${OPENAI_ANALYSIS_REPORT_MAX_COMPLETION_TOKENS:8000}
        # 도구를 싣는 두 경로. 모델을 여기서 고정하는 이유는 조합이 거절될 수 있어서다 —
        # gpt-5.6-luna 는 chat/completions 에서 도구와 reasoning_effort 를 함께 받지 않는다(400).
        # 기본 모델이 바뀌어도 이 두 경로는 따라가지 않는다.
        concept_chat_loop:
          model: ${OPENAI_CONCEPT_CHAT_MODEL:gpt-5-mini}
          reasoning-effort: ${OPENAI_CONCEPT_CHAT_REASONING_EFFORT:minimal}
          max-completion-tokens: ${OPENAI_CONCEPT_CHAT_MAX_COMPLETION_TOKENS:3000}
        essay_grading:
          model: ${OPENAI_ESSAY_GRADING_MODEL:gpt-5-mini}
          reasoning-effort: ${OPENAI_ESSAY_GRADING_REASONING_EFFORT:medium}
          max-completion-tokens: ${OPENAI_ESSAY_GRADING_MAX_COMPLETION_TOKENS:3000}
    grading:
      # 서술형 채점이 math 도구를 실을지. 단계 4 측정에서 도구 42회 호출이 판정을 바꾼 항목이
      # 0건이었고 프롬프트 토큰만 3.5배가 됐다(측정 문서 4_essay_grading_tool_ab.md).
      # 코드는 남겨 뒀으므로 문항 난이도가 오르면 켜서 다시 잰다.
      tools-enabled: ${AI_GRADING_TOOLS_ENABLED:false}
    verification:
      content-check:
        # 정답이 든 원본으로 해설 정합·개념 안내 누출을 본다. 끄면 문항당 LLM 호출이 절반이 된다.
        # 골든셋 측정과 개발 반복에서만 끈다. 꺼도 서술형 루브릭 심사는 계속 돈다.
        enabled: ${AI_VERIFICATION_CONTENT_CHECK_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
logging:
  pattern:
    # AgentDispatcher 가 채우는 traceId 를 로그 레벨 옆에 찍는다. 한 번의 에이전트 호출에
    # 걸린 로그를 이 값으로 묶어서 본다. 디스패치 밖의 로그는 빈 대괄호로 나온다.
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
