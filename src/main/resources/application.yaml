spring:
  application:
    name: cen-edu
  profiles:
    default: local
  config:
    # 프로젝트 루트의 .env 를 프로퍼티 파일로 읽는다. 파일이 없어도 기동된다(optional).
    # 실제 OS 환경 변수가 이 파일보다 우선순위가 높다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cen_edu}
    username: ${DB_USERNAME:cen}
    password: ${DB_PASSWORD:cen_local_password}
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마 변경은 Flyway 로만 한다. update / create 금지
    open-in-view: false
  flyway:
    enabled: true               # analysis baseline(V20260807_1000) 부터 활성
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  ai:
    guard:
      input:
        max-length: ${AI_INPUT_MAX_LENGTH:100}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}
logging:
  pattern:
    # AgentDispatcher 가 채우는 traceId 를 로그 레벨 옆에 찍는다. 한 번의 에이전트 호출에
    # 걸린 로그를 이 값으로 묶어서 본다. 디스패치 밖의 로그는 빈 대괄호로 나온다.
    level: "%5p [%X{traceId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

