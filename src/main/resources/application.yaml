spring:
  application:
    name: cen-edu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cen_edu}
    username: ${DB_USERNAME:cen}
    password: ${DB_PASSWORD:cen_local_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
