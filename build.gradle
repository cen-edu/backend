plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cenedu'
version = '0.0.1-SNAPSHOT'
description = 'CEN EDU backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Spring Boot BOM 밖의 의존성만 버전을 명시한다.
ext {
    jjwtVersion = '0.13.0'
    springdocVersion = '3.1.0'
    swaggerAnnotationsVersion = '2.2.52'
    openaiVersion = '4.50.0'
    springAiVersion = '2.0.0'
    awsSdkVersion = '2.49.6'
    archunitVersion = '1.5.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AWS s3
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'

    // 스키마 마이그레이션.
    // spring-boot-flyway 가 있어야 자동 설정이 붙는다. Boot 4 는 자동 설정을 기술별 모듈로
    // 쪼개서, flyway-core 만 넣으면 마이그레이션이 조용히 실행되지 않는다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT (5단계)
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Swagger UI — 프론트와의 API 계약서 (5단계)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    // Boot BOM의 이전 버전과 springdoc이 사용하는 swagger-core 버전이 섞이지 않도록 맞춘다.
    implementation "io.swagger.core.v3:swagger-annotations-jakarta:${swaggerAnnotationsVersion}"

    // LLM 호출 (6단계~). 도메인 패키지에서 직접 참조 금지, AgentDispatcher 경유.
    // openai-java-spring-boot-starter 를 쓰지 않는다. 그 스타터는 Spring Boot 2 기준이라
    // 이 프로젝트(Boot 4.1.0)와 맞지 않는다. OpenAIClient 빈은 ai/client 래퍼가 직접 만든다.
    implementation("com.openai:openai-java:${openaiVersion}") {
        // Jakarta 버전과 같은 패키지의 Schema 클래스를 중복 제공해 Swagger 기동을 깨뜨린다.
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // 실제 LLM 호출은 이 모듈을 통해서만 한다. 스타터(spring-ai-starter-model-openai)를 쓰지
    // 않는다 — 자동 설정이 붙으면 API 키가 없는 환경의 기동 여부가 자동 설정 사정에 따라
    // 달라지는데, 이 프로젝트는 "키가 없어도 뜨고 호출 시점에 실패한다"를 이미 정해 뒀다.
    // 2.0.0 을 쓴다. 1.1.x 는 Spring Framework 6 / Jackson 2 라 Boot 4 와 맞지 않는다.
    implementation("org.springframework.ai:spring-ai-openai:${springAiVersion}") {
        // 위와 같은 이유. 이 모듈도 openai-java-core 를 끌고 오므로 같은 제외가 필요하다.
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // MockMvc 자동 설정. Boot 4 에서 웹 계층 테스트 지원이 별도 모듈로 빠져,
    // starter-test 만으로는 @AutoConfigureMockMvc 를 쓸 수 없다.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // domain.. -> ai.client.. 직접 참조 금지 규칙 강제 (6단계)
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
