# EC2 로 들어오는 유일한 입구. 백엔드도 프론트도 포트를 열지 않고 이 프록시 뒤에만 있다.
#
# 브라우저가 보는 오리진이 하나(http://<EIP>)로 합쳐진다. 프론트의 VITE_API_BASE_URL
# 기본값이 /api 라 그대로 맞물리고, 오리진이 같으니 CORS 설정 자체가 필요 없다.

upstream cen_edu_backend {
    # compose 네트워크의 서비스 이름. IP 를 박지 않는다.
    server backend:8080;
}

upstream cen_edu_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # 문항·답안 이미지 업로드가 5MB 까지 허용된다(spring.servlet.multipart.max-file-size).
    # nginx 기본값 1m 이면 스프링에 닿기도 전에 413 이 난다.
    client_max_body_size 10m;

    # 채점·문항 생성은 비동기 잡이라 요청 자체는 짧다. 다만 보고서 PDF 렌더링과 집계
    # 조회는 동기라 길어질 수 있어 기본 60초보다 여유를 둔다.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://cen_edu_backend;
    }

    # 배포 확인용. EC2 밖에서 앱이 살아 있는지 보는 유일한 경로다.
    location = /actuator/health {
        proxy_pass http://cen_edu_backend;
    }

    # Swagger 는 운영에서 닫는다. 열어 두면 인증 없이 전체 API 목록과 스키마가 공개된다.
    # 시연 중 열어야 하면 이 블록을 지우지 말고 allow 로 팀 IP 만 통과시킨다.
    location ~ ^/(swagger-ui|v3/api-docs) {
        deny all;
    }

    # 나머지는 전부 프론트(React SPA). 새로고침 대응(try_files)은 프론트 컨테이너의
    # nginx 가 처리하므로 여기서는 넘기기만 한다.
    location / {
        proxy_pass http://cen_edu_frontend;
    }
}
