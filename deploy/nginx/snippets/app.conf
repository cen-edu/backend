# 80 과 443 이 똑같이 라우팅한다. 두 곳에 나눠 적으면 한쪽만 고치는 사고가 난다.
# 두 server 블록에서 이 파일을 include 한다.

# 필기 이미지 업로드가 기본값 1m 을 넘는다.
client_max_body_size 10m;

location /api/ {
    proxy_pass http://cen_edu_backend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # 백엔드가 원래 요청이 HTTPS 였는지 알아야 리다이렉트가 어긋나지 않는다.
    proxy_set_header X-Forwarded-Proto $scheme;

    # 채점·분석은 접수 후 폴링 구조라 개별 요청은 짧다. 그래도 PDF 렌더링처럼
    # 한 번에 오래 붙잡는 경로가 있어 기본값 60s 보다 넉넉히 둔다.
    proxy_connect_timeout 10s;
    proxy_send_timeout   300s;
    proxy_read_timeout   300s;
}

# 배포 스크립트와 감시 도구가 부른다.
location = /actuator/health {
    proxy_pass http://cen_edu_backend;
    proxy_set_header Host $host;
    access_log off;
}

# API 문서는 외부에 열지 않는다. 필요하면 SSH 터널로 8080 에 직접 붙는다.
location ~ ^/(swagger-ui|v3/api-docs) {
    deny all;
}

# 나머지는 프론트 컨테이너가 받는다. 주 경로는 Vercel(educen.site)이지만,
# EC2 로 직접 들어오는 길과 CloudFront 경로를 살려 두기 위한 예비다.
location / {
    proxy_pass http://cen_edu_frontend;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
