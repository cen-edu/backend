# AWS EC2 배포용 compose. 이 저장소에서 빌드하지 않는다 — Docker Hub 에 올려 둔
# 이미지를 받아서 띄운다(t3.micro 1GB 에서 Gradle 빌드는 OOM 으로 죽는다).
#
# EC2 에 올리는 파일은 이 파일과 .env 두 개뿐이다.
#   scp -i cen-edu.pem deploy/docker-compose.prod.yml ec2-user@<EIP>:/home/ec2-user/app/
#   scp -i cen-edu.pem deploy/.env.prod.example       ec2-user@<EIP>:/home/ec2-user/app/.env
#
# nginx 설정은 프론트 이미지 안에 들어 있다(프론트 저장소 deploy/nginx.conf).
# 라우팅을 바꾸려면 프론트 이미지를 다시 빌드해 새 태그로 올린다.
#
# 실행:
# 이 파일은 EC2 에서만 띄운다. 로컬에서 같이 올리면 개발용 compose.yaml 과
# cen-edu-postgres 컨테이너 이름이 부딪힌다. 로컬 개발은 compose.yaml 을 쓴다.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

# 프로젝트 이름을 고정한다. 디렉터리 이름에서 따오면 컨테이너·볼륨 접두사가 바뀌어
# 이전 배포의 볼륨을 못 찾는다.
name: cen-edu

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cen-edu-postgres
    restart: always
    # t3.micro 실측: 상한 256m 에서 119MB 를 썼다. shared_buffers 기본값 128MB 가
    # 이 메모리에는 과해서 함께 낮춘다. 시연 규모(동시 접속 한 자릿수)에는 넉넉하다.
    mem_limit: 192m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    # 포트를 열지 않는다. 열면 EC2 퍼블릭 IP 로 5432 가 노출되고, 보안 그룹 하나만
    # 잘못 열려도 DB 가 그대로 인터넷에 선다. 같은 네트워크의 backend 만 붙으면 된다.
    # 로컬에서 붙어야 하면 SSH 터널을 쓴다(README 아래 절 참고).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cen-edu-net

  backend:
    image: ${DOCKERHUB_USER}/cen-edu-backend:${APP_TAG}
    container_name: cen-edu-backend
    restart: always
    # 반드시 걸어야 한다. JAVA_OPTS 의 MaxRAMPercentage=75 는 상한이 없으면 호스트 전체를
    # 기준으로 잡아, t3.micro 에서 힙만 768MB 를 노린다. 그러면 PostgreSQL 과 부딪혀
    # 커널이 자바를 OOM 으로 죽인다.
    #
    # 384m 인 이유: t3.micro(총 913MB) 에서 512m 로 띄웠더니 컨테이너 합계 530MB +
    # OS·도커 데몬 116MB 가 물리 메모리를 넘겨 스왑 410MB 를 썼다. 스왑에 얹힌 힙은
    # 오래 쉬었다 열 때 첫 응답을 느리게 만든다. 384m 이면 힙 288MB 다.
    mem_limit: 384m
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 이름이 곧 호스트명이다. EC2 사설 IP 를 박으면 인스턴스를 새로 만들 때마다 바뀐다.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      TZ: Asia/Seoul
    depends_on:
      postgres:
        # Flyway 가 기동 시 마이그레이션을 돌린다. DB 가 덜 뜬 상태로 붙으면 앱이 죽는다.
        condition: service_healthy
    # 8080 을 공개하지 않는다. 외부에서 들어오는 길은 frontend 의 nginx 하나뿐이다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Flyway 마이그레이션 + 컨텍스트 기동에 시간이 걸린다. 이 구간의 실패는 세지 않는다.
      start_period: 90s
    networks:
      - cen-edu-net

  # 서비스의 유일한 입구. nginx 가 정적 파일을 서빙하면서 /api 를 backend 로 넘긴다.
  frontend:
    image: ${DOCKERHUB_USER}/cen-edu-frontend:${FRONTEND_TAG}
    container_name: cen-edu-frontend
    restart: always
    # 정적 서빙 + 프록시라 실측 2.5MB 다. 32m 도 과하게 잡은 값이다.
    mem_limit: 32m
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cen-edu-net

networks:
  cen-edu-net:
    driver: bridge

volumes:
  # 컨테이너를 지워도 데이터는 남는다. 이미지를 새 태그로 갈아끼워도 이 볼륨은 건드리지 않는다.
  postgres-data:
