# AWS EC2 배포용 compose. 이 저장소에서 빌드하지 않는다 — Docker Hub 에 올려 둔
# 이미지를 받아서 띄운다(t3.micro 1GB 에서 Gradle 빌드는 OOM 으로 죽는다).
#
# 프론트는 Vercel 이 서빙한다. 여기 있는 것은 API 와 그 앞단뿐이다.
#
# EC2 에 올리는 파일:
#   scp -i cen-edu.pem deploy/docker-compose.prod.yml ec2-user@<EIP>:/home/ec2-user/app/
#   scp -i cen-edu.pem deploy/.env.prod.example       ec2-user@<EIP>:/home/ec2-user/app/.env
#   scp -i cen-edu.pem -r deploy/nginx                ec2-user@<EIP>:/home/ec2-user/app/
#   scp -i cen-edu.pem deploy/init-letsencrypt.sh     ec2-user@<EIP>:/home/ec2-user/app/
#
# 처음 한 번은 인증서를 발급받아야 한다(nginx 가 인증서 없이는 443 을 못 연다):
#   ./init-letsencrypt.sh
#
# 이후 실행:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

# 프로젝트 이름을 고정한다. 디렉터리 이름에서 따오면 컨테이너·볼륨 접두사가 바뀌어
# 이전 배포의 볼륨을 못 찾는다.
name: cen-edu

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cen-edu-postgres
    restart: always
    # t3.micro 실측: 상한 256m 에서 119MB 를 썼다. shared_buffers 기본값 128MB 가
    # 이 메모리에는 과해서 함께 낮춘다. 시연 규모(동시 접속 한 자릿수)에는 넉넉하다.
    mem_limit: 192m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    # 포트를 열지 않는다. 열면 EC2 퍼블릭 IP 로 5432 가 노출되고, 보안 그룹 하나만
    # 잘못 열려도 DB 가 그대로 인터넷에 선다. 같은 네트워크의 backend 만 붙으면 된다.
    # 로컬에서 붙어야 하면 SSH 터널을 쓴다(README 아래 절 참고).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cen-edu-net

  backend:
    image: ${DOCKERHUB_USER}/cen-edu-backend:${APP_TAG}
    container_name: cen-edu-backend
    restart: always
    # 반드시 걸어야 한다. JAVA_OPTS 의 MaxRAMPercentage=75 는 상한이 없으면 호스트 전체를
    # 기준으로 잡아, t3.micro 에서 힙만 768MB 를 노린다. 그러면 PostgreSQL 과 부딪혀
    # 커널이 자바를 OOM 으로 죽인다.
    #
    # 상한은 튜닝 손잡이가 아니라 안전장치다. PDF 렌더링이나 큰 채점 배치처럼 순간적으로
    # 튀는 경로에서 컨테이너가 OOM 으로 죽지 않도록 천장을 넉넉히 둔다. 기능이 더 붙어
    # 사용량이 늘어도 이 값을 다시 만질 일이 없게 하려는 것이다.
    #
    # 대신 평상시 힙은 아래 JAVA_OPTS 의 MaxRAMPercentage 로 따로 낮춘다. 둘을 묶어 두면
    # (기본 75%) 천장을 올리는 순간 평상시 사용량도 같이 올라간다 — t3.micro 실측에서
    # 512m 상한이 스왑 410MB 를 쓴 이유가 그것이다.
    mem_limit: 640m
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 이미지 기본값은 75% 다. t3.micro(총 913MB)에서는 그 비율이면 상한을 올릴 때마다
      # 힙이 따라 커져 시스템이 스왑을 쓴다. 55% 로 낮추면 힙 352MB, 나머지 288MB 는
      # 메타스페이스·스레드 스택·순간 급증분이 쓸 여유로 남는다.
      JAVA_OPTS: -XX:MaxRAMPercentage=55.0
      # 컨테이너 이름이 곧 호스트명이다. EC2 사설 IP 를 박으면 인스턴스를 새로 만들 때마다 바뀐다.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      TZ: Asia/Seoul
    depends_on:
      postgres:
        # Flyway 가 기동 시 마이그레이션을 돌린다. DB 가 덜 뜬 상태로 붙으면 앱이 죽는다.
        condition: service_healthy
    # 8080 을 공개하지 않는다. 외부에서 들어오는 길은 nginx 하나뿐이다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Flyway 마이그레이션 + 컨텍스트 기동에 시간이 걸린다. 이 구간의 실패는 세지 않는다.
      start_period: 90s
    networks:
      - cen-edu-net

  # 서비스의 유일한 입구. TLS 를 끊고 /api 를 backend 로 넘긴다.
  nginx:
    image: nginx:1.27-alpine
    container_name: cen-edu-nginx
    restart: always
    # 정적 파일을 다루지 않는 순수 프록시라 실측 수 MB 다.
    mem_limit: 48m
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 인증서 경로와 server_name 에 함께 쓰인다. .env 에서 읽는다.
      SERVER_NAME: ${SERVER_NAME}
      # 템플릿에서 치환할 변수를 이것만으로 좁힌다. 지정하지 않으면 $host, $scheme 같은
      # nginx 자체 변수까지 빈 문자열로 치환돼 설정이 조용히 망가진다.
      NGINX_ENVSUBST_FILTER: SERVER_NAME
    volumes:
      # 이미지가 기동할 때 templates/*.template 를 envsubst 해서 conf.d 로 옮긴다.
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - cen-edu-net

  # 평소에는 뜨지 않는다(profiles). t3.micro 에서 상주시킬 이유가 없다 —
  # 발급과 갱신이 필요할 때만 일회성으로 돌린다.
  #
  #   최초 발급 : ./init-letsencrypt.sh
  #   갱신      : docker compose -f docker-compose.prod.yml run --rm certbot renew
  #               docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
  #
  # 갱신은 crontab 에 걸어 둔다(인증서 수명이 90일이라 사람이 기억할 수 없다):
  #   0 4 * * 1 cd /home/ec2-user/app && docker compose -f docker-compose.prod.yml run --rm certbot renew --quiet && docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
  certbot:
    image: certbot/certbot:latest
    container_name: cen-edu-certbot
    profiles:
      - tools
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - cen-edu-net

networks:
  cen-edu-net:
    driver: bridge

volumes:
  # 컨테이너를 지워도 데이터는 남는다. 이미지를 새 태그로 갈아끼워도 이 볼륨은 건드리지 않는다.
  postgres-data:
  # 발급받은 인증서. 이 볼륨을 잃으면 재발급해야 한다(Let's Encrypt 주당 발급 한도에 걸린다).
  letsencrypt:
  # ACME 소유 확인용 임시 파일. nginx 가 읽고 certbot 이 쓴다.
  certbot-webroot:
