services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cen-edu-postgres
    environment:
      POSTGRES_DB: cen_edu
      POSTGRES_USER: cen
      POSTGRES_PASSWORD: cen_local_password
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cen -d cen_edu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
