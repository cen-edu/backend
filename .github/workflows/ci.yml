# PR 에서 테스트를 돌린다.
#
# main push 는 여기서 다루지 않는다. 그쪽은 Deploy 워크플로가 배포 전에 같은 테스트를
# 돌리므로, 여기서도 돌리면 같은 커밋을 두 번 검사하며 실행 시간만 두 배로 쓴다.
#
# OPENAI_API_KEY 를 주지 않는다. *LiveTest 들이 @EnabledIfEnvironmentVariable 로
# 그 키를 보고 스스로 켜지고 꺼지므로, 키가 없으면 자동으로 건너뛴다. 키를 넣으면
# 실제 OpenAI 를 호출해 PR 마다 수 분과 토큰이 나간다.
name: CI

on:
  pull_request:
    branches: [main]

# 같은 브랜치에 연달아 push 하면 이전 실행을 취소한다. 무료 실행 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew test --no-daemon
        env:
          # 테스트가 src/main/resources/application.yaml 을 그대로 쓰고, 그 파일이
          # 개발자 로컬의 .env 를 읽는다. 그래서 .env 가 있는 기계에서만 통과했다.
          # 깨끗한 체크아웃에서는 아래 값들이 없어 스프링 컨텍스트가 뜨지 못하고
          # @SpringBootTest 가 전부 깨진다.
          #
          # 진짜 값이 아니어도 된다 — 형식만 맞으면 컨텍스트가 뜬다. 테스트는 S3 나
          # 외부 서비스를 실제로 부르지 않는다(S3_ENABLED 기본값이 false).
          #
          # 근본 해결은 테스트가 로컬 .env 에 기대지 않게 만드는 것이다. 다만 그러려면
          # 테스트 전용 설정을 따로 두어야 하고, 그건 이 저장소의 모든 테스트에 영향을
          # 준다. 여기서는 CI 를 세우는 것까지만 한다.
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-bytes-long
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy

      # 실패했을 때 어느 테스트가 왜 깨졌는지 로그만으로는 읽기 어렵다.
      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
