# main 에 들어오면 자동으로 배포한다. 되돌리거나 특정 태그를 다시 올릴 때만 손으로 실행한다.
#
# 태그는 커밋 SHA 를 쓴다. 매번 고유해서 같은 태그를 덮어쓸 일이 없고, 무엇이 돌고 있는지
# 커밋으로 바로 되짚힌다. latest 는 쓰지 않는다 — 되돌릴 이전 태그가 남지 않는다.
#
# 되돌리기: Actions 탭에서 이 워크플로를 Run workflow 로 실행하고, 돌아가고 싶은
#          예전 SHA 를 tag 에 넣는다. 그 이미지는 Docker Hub 에 그대로 있다.
#
# 시연 중처럼 배포가 끼면 곤란할 때: Actions 탭 > 이 워크플로 > 우측 "..." > Disable workflow.
#          다시 켤 때까지 main 에 머지해도 배포되지 않는다.
#
# 필요한 Secrets (저장소 Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   Docker Hub 계정
#   DOCKERHUB_TOKEN      Docker Hub 액세스 토큰 (계정 비밀번호가 아니다)
#   EC2_HOST             Elastic IP
#   EC2_USER             예: ec2-user
#   EC2_SSH_KEY          .pem 파일 내용 전체 (-----BEGIN ... 부터 끝까지)
#
# 로컬에서 배포하던 scripts/release.ps1 은 그대로 두었다. Actions 가 막히거나
# 급할 때 쓸 수 있는 길을 하나 남겨 둔다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '되돌릴 이미지 태그(커밋 SHA). 비우면 지금 커밋으로 새로 빌드한다.'
        required: false
        type: string

# 배포가 겹치면 EC2 에서 두 개의 compose 가 동시에 컨테이너를 갈아끼운다. 줄을 세운다.
# 앞선 배포를 취소하지 않는다 — 중간에 끊으면 어느 태그가 떠 있는지 알 수 없게 된다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 자동 배포라 사람이 걸러 주지 않는다. 여기서 막지 못하면 깨진 코드가 그대로 나간다.
  #
  # OPENAI_API_KEY 를 주지 않는다. LiveTest 들이 @EnabledIfEnvironmentVariable 로 그 키를
  # 보고 스스로 켜지므로, 키가 없으면 자동으로 건너뛴다. 키를 넣으면 배포마다 수 분과
  # 토큰이 나간다.
  test:
    # 되돌리기(이미 빌드된 태그를 지정)일 때는 다시 돌릴 이유가 없다.
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew test --no-daemon
        env:
          # 테스트가 로컬 .env 에 기대고 있어, 깨끗한 체크아웃에서는 이 값들이 없으면
          # 스프링 컨텍스트가 뜨지 못한다. 자세한 사정은 ci.yml 의 같은 자리에 적었다.
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-bytes-long
          AWS_ACCESS_KEY_ID: ci-dummy
          AWS_SECRET_ACCESS_KEY: ci-dummy

      - name: 테스트 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  build:
    needs: test
    # test 가 건너뛰어졌을 때(되돌리기)도 진행해야 한다. 다만 실패했으면 멈춘다.
    if: always() && needs.test.result != 'failure' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: 태그 결정
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "되돌리기: 이미 있는 이미지 ${{ inputs.tag }} 를 그대로 쓴다"
          else
            echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 되돌리기면 그 이미지가 Docker Hub 에 실제로 있어야 한다. 없는 태그로 배포하면
      # EC2 에서 pull 이 실패해 서비스가 내려간 채로 남는다.
      - name: 되돌릴 이미지 확인
        if: inputs.tag != ''
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/cen-edu-backend:${{ steps.tag.outputs.value }}"
          if ! docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image 가 Docker Hub 에 없다. 태그를 확인한다." >&2
            exit 1
          fi

      # 러너의 기본 buildx 드라이버는 docker 인데, 그 드라이버는 캐시 내보내기를 지원하지
      # 않는다. 아래 build-push-action 이 cache-to: type=gha 를 쓰므로
      # "Cache export is not supported for the docker driver" 로 죽는다.
      # 이 액션이 docker-container 드라이버 빌더를 만들어 준다.
      - name: Buildx 설정
        if: inputs.tag == ''
        uses: docker/setup-buildx-action@v3

      - name: 빌드와 push
        if: inputs.tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cen-edu-backend:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # deploy.sh 가 헬스체크까지 기다렸다가, 실패하면 되돌리는 방법을 로그에 남긴다.
      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            ./deploy.sh ${{ needs.build.outputs.tag }}

      - name: 배포한 태그
        run: echo "${{ needs.build.outputs.tag }} 배포 완료"
