# 이미지를 빌드해 Docker Hub 에 올리고 EC2 에 배포한다.
#
# 손으로 실행한다(workflow_dispatch). main 에 push 할 때마다 자동으로 배포하지 않는 이유는,
# 시연 중에 누가 머지하면 그 자리에서 서비스가 재시작되기 때문이다. 배포 시점은 사람이 정한다.
#
# 필요한 Secrets (저장소 Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   Docker Hub 계정
#   DOCKERHUB_TOKEN      Docker Hub 액세스 토큰 (계정 비밀번호가 아니다)
#   EC2_HOST             예: 43.201.0.0
#   EC2_USER             예: ec2-user
#   EC2_SSH_KEY          .pem 파일 내용 전체 (-----BEGIN ... 부터 끝까지)
#
# 로컬에서 배포하던 scripts/release.ps1 은 그대로 두었다. Actions 가 막히거나
# 급할 때 쓸 수 있는 길을 하나 남겨 둔다.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '이미지 태그 (예: 1.4.0). latest 는 쓰지 않는다 — 무엇이 돌고 있는지 구분되지 않고 되돌릴 이전 태그도 남지 않는다.'
        required: true
        type: string

# 배포가 겹치면 EC2 에서 두 개의 compose 가 동시에 컨테이너를 갈아끼운다. 줄을 세운다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 태그 형식 확인
        run: |
          if [ "${{ inputs.tag }}" = "latest" ]; then
            echo "latest 는 쓰지 않는다. 버전을 붙인다 (예: 1.4.0)." >&2
            exit 1
          fi

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # 배포 전에 한 번 더 돌린다. CI 를 통과한 커밋이라도, 배포하는 시점의
      # main 이 그 커밋이라는 보장은 없다.
      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 같은 태그를 덮어쓰면 EC2 가 이미 받아 둔 이미지를 그대로 써서
      # "고쳤는데 안 바뀐다" 가 된다. 먼저 막는다.
      - name: 이미 있는 태그인지 확인
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/cen-edu-backend:${{ inputs.tag }}"
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "$image 는 이미 Docker Hub 에 있다. 태그를 올린다." >&2
            exit 1
          fi

      - name: 빌드와 push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cen-edu-backend:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            ./deploy.sh ${{ inputs.tag }}
